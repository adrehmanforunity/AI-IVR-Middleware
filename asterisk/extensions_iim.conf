; FreePBX: paste into /etc/asterisk/extensions_custom.conf then fwconsole reload
;
; Custom Destination Target (inbound routes use EXTEN=s):
;   iim-inbound,s,1
; Return: No
;
; Do not use a second context with exten => _.  — Asterisk will not match
; Goto(iim-inbound-run,7777,1) against _ .
;
; Lab: 2098 dials 7777 → FROM_DID=7777 → Goto 7777 in this same context (_X.).

[iim-inbound]
exten => s,1,NoOp(IIM entry EXTEN=${EXTEN} FROM_DID=${FROM_DID} DNID=${CALLERID(dnid)})
 same => n,Verbose(1,[IIM] inbound route hit s FROM_DID=${FROM_DID} CLI=${CALLERID(num)} CHAN=${CHANNEL})
 same => n,Gosub(iim-pick-did,s,1)
 same => n,Goto(${IIM_DID},1)

exten => i,1,Verbose(1,[IIM] invalid in iim-inbound EXTEN=${EXTEN} FROM_DID=${FROM_DID} IIM_DID=${IIM_DID})
 same => n,Hangup()

exten => _X.,1,NoOp(IIM CLI=${CALLERID(num)} DID=${EXTEN} CHAN=${CHANNEL})
 same => n,Verbose(1,[IIM] ===== inbound start DID=${EXTEN} =====)
 same => n,Verbose(1,[IIM] received CLI=${CALLERID(num)} NAME=${CALLERID(name)} DID=${EXTEN} DNID=${CALLERID(dnid)} FROM_DID=${FROM_DID})
 same => n,Verbose(1,[IIM] received CHAN=${CHANNEL} CTX=${CONTEXT} PRI=${PRIORITY} UID=${UNIQUEID} LINKEDID=${CHANNEL(linkedid)})
 same => n,Verbose(1,[IIM] received CONNECTED=${CONNECTEDLINE(num)} LANGUAGE=${CHANNEL(language)} STATE=${CHANNEL(state)})
 same => n,Log(NOTICE,[IIM] inbound received CLI=${CALLERID(num)} DID=${EXTEN} CHAN=${CHANNEL} UID=${UNIQUEID})
 same => n,DumpChan()
 same => n,Verbose(1,[IIM] entering Stasis(pulse-pbx-app) DID=${EXTEN} CLI=${CALLERID(num)})
 same => n,Log(NOTICE,[IIM] Stasis enter app=pulse-pbx-app DID=${EXTEN} CLI=${CALLERID(num)} CHAN=${CHANNEL})
 same => n,Stasis(pulse-pbx-app)
 same => n,Verbose(1,[IIM] ===== Stasis returned =====)
 same => n,Verbose(1,[IIM] STASISSTATUS=${STASISSTATUS} HANGUPCAUSE=${HANGUPCAUSE} DID=${EXTEN} CLI=${CALLERID(num)})
 same => n,Log(NOTICE,[IIM] Stasis returned STATUS=${STASISSTATUS} CAUSE=${HANGUPCAUSE} DID=${EXTEN})
 same => n,Hangup()

[iim-pick-did]
exten => s,1,Set(IIM_DID=${FROM_DID})
 same => n,GotoIf($["${IIM_DID}" != "" & "${IIM_DID}" != "s" & "${IIM_DID}" != "ANY"]?done)
 same => n,Set(IIM_DID=${CALLERID(dnid)})
 same => n,GotoIf($["${IIM_DID}" != "" & "${IIM_DID}" != "s"]?done)
 same => n,Set(IIM_DID=7777)
 same => n(done),Verbose(1,[IIM] picked DID=${IIM_DID})
 same => n,Return()
