<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IVR functions — IIM</title>
    <link rel="stylesheet" href="/vendor/tabler/tabler.min.css" />
    <link rel="stylesheet" href="/css/iim.css?v=12" />
  </head>
  <body data-nav="/functions">
    <div class="page">
      <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid" id="iim-sidebar"></div>
      </aside>
      <div class="page-wrapper">
        <div id="iim-top"></div>
        <div class="page-body">
          <div class="container-xl">
            <div class="hello">
            <div>
              <h2>IVR functions</h2>
              <p>
                Generic functions ship with IIM. Custom functions are for this customer: name them, point them at a
                PULSE API, then pick them in an IVR <strong>Do</strong> row. Each function returns true or false.
              </p>
            </div>
          </div>

          <section class="panel">
            <h3>Generic</h3>
            <div id="generic" class="muted">Loading…</div>
          </section>

          <section class="panel">
            <h3>Custom</h3>
            <div id="custom" class="muted">Loading…</div>
          </section>

          <section class="panel">
            <h3 id="form-title">Add custom function</h3>
            <form id="form">
              <input type="hidden" id="fnId" value="" />
              <div class="form-grid">
                <div>
                  <label for="name">Name (what IVR sees)</label>
                  <input id="name" required placeholder="proc_bok_authcaller" />
                </div>
                <div>
                  <label for="pulseSlot">PULSE API</label>
                  <select id="pulseSlot" required></select>
                </div>
                <div class="full">
                  <label for="description">Description</label>
                  <input id="description" placeholder="Authenticate BOK caller" />
                </div>
                <div>
                  <label for="paramHint">Param hint</label>
                  <input id="paramHint" placeholder="BOK" />
                </div>
                <div class="check">
                  <input id="enabled" type="checkbox" checked />
                  <label for="enabled">Enabled</label>
                </div>
              </div>
              <div class="row" style="margin-top: 16px">
                <button class="btn" type="submit">Save function</button>
                <button class="btn ghost" type="button" id="reset">New</button>
                <span class="muted" id="msg"></span>
              </div>
            </form>
          </section>
          </div>
        </div>
      </div>
    </div>
    <script src="/vendor/tabler/tabler.min.js"></script>
    <script src="/js/icons.js?v=1"></script>
    <script src="/js/layout.js?v=2"></script>
    <script src="/js/user-menu.js?v=4"></script>
    <script src="/js/functions.js"></script>
  </body>
</html>
