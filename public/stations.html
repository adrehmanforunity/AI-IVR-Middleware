<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIM stations — IIM</title>
    <link rel="stylesheet" href="/vendor/tabler/tabler.min.css" />
    <link rel="stylesheet" href="/css/iim.css?v=12" />
  </head>
  <body data-nav="/stations">
    <div class="page">
      <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid" id="iim-sidebar"></div>
      </aside>
      <div class="page-wrapper">
        <div id="iim-top"></div>
        <div class="page-body">
          <div class="container-xl">
            <div class="page-header d-print-none">
              <div class="row align-items-center">
                <div class="col">
                  <div class="page-pretitle">IIM</div>
                  <h2 class="page-title">IIM stations</h2>
                  <div class="text-secondary" id="range-hint">
                    Agent-side extensions this process owns. Change the range on <a href="/telephony">Telephony Setup</a>
                    (system configuration). Default 3001–3999. Status is one cached ARI list, not AMI events.
                  </div>
                </div>
              </div>
            </div>
            <div class="row row-deck row-cards mb-3" id="kpis"></div>
            <div class="card">
              <div class="card-body">
                <div class="btn-list mb-3">
                  <button class="btn btn-outline-secondary filter-btn active" type="button" data-filter="all">All</button>
                  <button class="btn btn-outline-secondary filter-btn" type="button" data-filter="idle">Idle</button>
                  <button class="btn btn-outline-secondary filter-btn" type="button" data-filter="in-use">In use</button>
                  <button class="btn btn-outline-secondary filter-btn" type="button" data-filter="unregistered">Unregistered</button>
                  <button class="btn btn-outline-secondary filter-btn" type="button" data-filter="not-on-pbx">Not on PBX</button>
                  <span class="text-secondary" id="refresh-hint"></span>
                </div>
                <div id="list" class="text-secondary">Loading…</div>
                <div id="pager" class="pager" hidden></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/vendor/tabler/tabler.min.js"></script>
    <script src="/js/icons.js?v=1"></script>
    <script src="/js/layout.js?v=2"></script>
    <script src="/js/user-menu.js?v=4"></script>
    <script src="/js/stations.js?v=2"></script>
  </body>
</html>
