<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IVRs — IIM</title>
    <link rel="stylesheet" href="/vendor/tabler/tabler.min.css" />
    <link rel="stylesheet" href="/css/iim.css?v=16" />
  </head>
  <body data-nav="/ivrs">
    <div class="page">
      <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid" id="iim-sidebar"></div>
      </aside>
      <div class="page-wrapper">
        <div id="iim-top"></div>
        <div class="page-body">
          <div class="container-xl">
            <div class="hello">
            <div>
              <h2>IVRs</h2>
              <p>
                Pick an IVR to edit one <strong>menu</strong> at a time. <strong>Analyze</strong> lists every voice file
                this program will play so you can put them on Asterisk. Open <strong>Flow</strong> to see the call path.
              </p>
            </div>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h3>Defined IVRs</h3>
              <div class="btn-row" style="margin: 0">
                <button class="btn btn-outline-secondary" type="button" id="import-json">Import JSON</button>
                <input id="import-file" type="file" accept="application/json,.json" hidden />
                <button class="btn btn-primary" type="button" id="new-ivr">New IVR</button>
              </div>
            </div>
            <div id="list" class="muted" style="margin-top: 12px">Loading…</div>
          </section>

          <section class="panel editor-panel" id="editor-panel" hidden>
            <h3 id="form-title">Edit IVR</h3>
            <form id="form">
              <input type="hidden" id="ivrId" value="" />
              <div class="form-grid">
                <div>
                  <label for="name">IVR name</label>
                  <input id="name" required placeholder="Main IVR" />
                </div>
                <div class="check">
                  <input id="enabled" type="checkbox" checked />
                  <label for="enabled">Enabled</label>
                </div>
              </div>
              <div class="ivr-work">
                <div>
                  <div class="muted" style="margin-bottom: 8px">Menus</div>
                  <div id="step-nav" class="step-nav"></div>
                  <button class="btn btn-outline-secondary" type="button" id="add-menu" style="margin-top: 8px; width: 100%">
                    Add menu
                  </button>
                </div>
                <div id="step-form"></div>
              </div>
              <div class="btn-row" style="margin-top: 16px">
                <button class="btn btn-primary" type="submit">Save IVR</button>
                <button class="btn btn-outline-secondary" type="button" id="analyze-ivr">Analyze</button>
                <button class="btn btn-outline-secondary" type="button" id="export-json">Export JSON</button>
                <button class="btn btn-outline-secondary" type="button" id="open-flow">Open flow</button>
                <button class="btn btn-outline-secondary" type="button" id="close-editor">Close</button>
                <span class="muted" id="msg"></span>
              </div>
            </form>
          </section>
          <div id="analyze-modal" class="modal-back" hidden>
            <div class="modal-card modal-wide">
              <h3 id="analyze-title">Analyze</h3>
              <p class="muted" id="analyze-summary"></p>
              <div id="analyze-body"></div>
              <div class="modal-actions">
                <button class="btn btn-outline-secondary" type="button" id="analyze-copy">Copy file list</button>
                <button class="btn btn-primary" type="button" id="analyze-close">Close</button>
              </div>
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/vendor/tabler/tabler.min.js"></script>
    <script src="/js/icons.js?v=3"></script>
    <script src="/js/layout.js?v=6"></script>
    <script src="/js/user-menu.js?v=6"></script>
    <script src="/js/ivrs.js?v=11"></script>
  </body>
</html>
